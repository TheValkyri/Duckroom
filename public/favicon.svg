<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" fill="none">
  <style>
    .duck-shape { fill: #18181b; }
    .duck-stroke { stroke: #18181b; fill: none; }
    .duck-eye { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .duck-shape { fill: #f4f4f5; }
      .duck-stroke { stroke: #f4f4f5; }
      .duck-eye { fill: #18181b; }
    }
  </style>
  <!-- Duck Beak - Monoline Geometric -->
  <path
    class="duck-shape"
    d="M26 18C29 18 34 19.5 35 22C33.5 24.5 28 24 26 23.5V18Z"
    opacity="0.9"
  />
  <!-- Duck Head & Body Silhouette -->
  <path
    class="duck-shape"
    d="M12 28C12 20 16 12 23 12C26.5 12 28.5 14.5 28.5 18C28.5 23 23 25 21 28C19.5 30 16 32 12 28Z"
  />
  <!-- DJ Headphone Band -->
  <path
    class="duck-stroke"
    d="M13 8C18 5 27 5 31 10"
    stroke-width="3.5"
    stroke-linecap="round"
  />
  <!-- DJ Ear Cup -->
  <rect
    class="duck-shape"
    x="9"
    y="13"
    width="6"
    height="10"
    rx="3"
  />
  <!-- Duck Eye Aperture -->
  <circle class="duck-eye" cx="21" cy="16" r="2" />
</svg>